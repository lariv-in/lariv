{{define "input_datetime"}}
{{if .Hidden}}
<div class="hidden">
	<input type="hidden" name="{{.Name}}" value="{{.Value}}">
</div>
{{else}}
<div class="my-1 {{.Classes}}">
	<label class="label text-sm font-bold flex flex-col items-start gap-1">
		{{.Label}}
		<input type="datetime-local" name="{{.Name}}" value="{{.Value}}" class="input input-bordered w-full {{.Classes}}"{{if .Required}} required{{end}}>
	</label>
</div>
{{end}}
{{end}}
