{{define "input_file"}}
<div class="my-1 {{.Classes}}">
	<label class="label text-sm font-bold flex flex-col items-start gap-1">
		{{.Label}}
		<input type="file" name="{{.Name}}" class="file-input file-input-bordered w-full {{.Classes}}"{{if .Required}} required{{end}}{{if .Multiple}} multiple{{end}}{{if .Accept}} accept="{{.Accept}}"{{end}}>
	</label>
</div>
{{end}}
