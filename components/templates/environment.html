{{define "environment"}}
<div class="my-1 {{.Classes}}">
	{{if .Label}}<label class="label text-sm font-bold">{{.Label}}</label>{{end}}
	<select name="{{.Name}}" class="select select-bordered w-full"{{attrs .Attrs}}>
		{{range .Options}}
		<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>
		{{end}}
	</select>
</div>
{{end}}
