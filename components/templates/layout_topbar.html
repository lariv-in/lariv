{{define "layout_topbar"}}
<div class="h-screen flex flex-col overflow-hidden"{{if .XData}} x-data="{{.XData}}"{{end}}>
	<div class="navbar bg-base-100 border-b border-base-300 px-4 flex justify-between items-center flex-none">
		<div class="flex-1"></div>
		<div class="flex-none flex items-center gap-2">{{.TopbarItems}}</div>
	</div>
	{{if .HasSidebar}}
	<div class="flex-1 flex overflow-hidden relative">
		<div class="flex-1 overflow-hidden">{{.Children}}</div>
		<div class="xl:hidden absolute inset-0 bg-neutral-900/40 z-30 transition-opacity" x-show="showRight" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="toggleRight()"></div>
		<div class="hidden xl:flex w-2 -mx-1 cursor-col-resize flex-none h-full relative z-50 items-center justify-center hover:bg-primary/20 active:bg-primary/30 transition-all duration-150 group" x-show="showRight" @mousedown="startResize($event)" :class="isResizing ? 'bg-primary/20' : ''">
			<div class="w-[1px] h-full bg-base-300 group-hover:bg-primary group-active:bg-primary transition-colors duration-150" :class="isResizing ? 'bg-primary' : ''"></div>
		</div>
		<aside class="flex-none bg-base-100 flex flex-col h-full overflow-hidden absolute right-0 top-0 z-40 border-l border-base-300 shadow-2xl max-w-[85vw] sm:max-w-[400px] xl:static xl:border-l-0 xl:shadow-none xl:max-w-none" x-show="showRight" x-transition:enter="transition ease-out duration-200 transform" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-150 transform" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full" :style="'width: ' + rightSidebarWidth + 'px'" style="width: 320px;">
			{{if .ShowTabs}}
			<div class="flex items-center gap-2 border-b border-base-300 p-2 overflow-x-auto flex-none">
				{{range .Tabs}}
				<button class="btn btn-sm btn-square" :class="{{.ClassExpr}}" @click="{{.Click}}">{{.Icon}}</button>
				{{end}}
			</div>
			{{end}}
			<div class="flex-1 overflow-hidden relative">
				{{range .Panels}}
				<div x-show="{{.Show}}" class="h-full overflow-y-auto p-0">{{.Content}}</div>
				{{end}}
			</div>
		</aside>
	</div>
	{{else}}
	<div class="flex-1 overflow-hidden">{{.Children}}</div>
	{{end}}
</div>
{{end}}
