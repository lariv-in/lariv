{{define "input_textarea"}}
<div class="my-1 {{.Classes}}">
	<label class="label text-sm font-bold flex flex-col items-start gap-1">
		{{.Label}}
		<textarea name="{{.Name}}" rows="{{.Rows}}" class="textarea textarea-bordered w-full {{.Classes}}"{{if .Required}} required{{end}}>{{.Value}}</textarea>
	</label>
</div>
{{end}}
