{{define "apps_grid"}}
<div class="container max-w-5xl mx-auto mt-4 @container" x-data="{ search: ''}">
	<div class="mb-4">
		<input type="text" x-model="search" placeholder="Search apps..." class="input input-bordered w-full">
	</div>
	<div class="grid grid-cols-2 @md:grid-cols-4 @2xl:grid-cols-6 gap-2">
		{{range .Apps}}
		<a href="{{.Href}}" class="btn btn-md h-auto flex-col space-y-1 py-4" x-show="{{.XShow}}" x-cloak>
			{{.Icon}}
			<div class="text-sm truncate min-w-0 w-full">{{.VerboseName}}</div>
		</a>
		{{end}}
	</div>
</div>
{{end}}
