{{define "input_vnode"}}
<div class="my-1 {{.Classes}}">
	<label class="label text-sm font-bold">{{.Label}}</label>
	{{if .HasFile}}
	<div class="flex items-center gap-2 text-sm my-1">
		{{.Icon}}
		<span>{{.FileName}}</span>
		<span class="opacity-50">({{.FileSize}})</span>
	</div>
	{{end}}
	<input type="file" name="{{.Name}}" class="file-input file-input-bordered w-full {{.Classes}}"{{if .Required}} required{{end}}{{if .Accept}} accept="{{.Accept}}"{{end}}>
</div>
{{end}}
